<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tech Knowledge Base</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="version">v0.2 · Ollama Integration</p>
        <h1>Tech Knowledge Base</h1>
        <p>個人技術知識庫，從一個問題開始。</p>
      </header>
      <section aria-labelledby="question-heading">
        <h2 id="question-heading">你想了解什麼？</h2>
        <p id="question-help">由本機 Ollama 回答你的問題。目前尚未使用本地筆記。</p>
        <form id="question-form">
          <label for="question">你的問題</label>
          <textarea id="question" name="question" rows="5" required maxlength="10000"
            aria-describedby="question-help"
            placeholder="例如：Python 的 list 和 tuple 有什麼差別？"></textarea>
          <button type="submit">送出問題</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <noscript>請啟用 JavaScript 以送出問題並顯示回答。</noscript>
      </section>
      <section id="answer-section" aria-labelledby="answer-heading" hidden>
        <h2 id="answer-heading">回答</h2>
        <div id="answer"></div>
      </section>
    </main>
  </body>
</html>
