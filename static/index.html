<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tech Knowledge Base</title>
    <link rel="stylesheet" href="/static/style.css?v=source-block-2">
    <script src="/static/app.js?v=source-block-2" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="version">v0.4 · Source Display</p>
        <h1>Tech Knowledge Base</h1>
        <p>個人技術知識庫，從一個問題開始。</p>
      </header>
      <section aria-labelledby="question-heading">
        <h2 id="question-heading">你想了解什麼？</h2>
        <p id="question-help">優先參考本地技術筆記，由本機 Ollama 回答你的問題，並在回答下方顯示內容來源。</p>
        <form id="question-form">
          <label for="model">選擇模型</label>
          <select id="model" name="model">
            <option value="gemma3:latest" selected>gemma3:latest（預設）</option>
            <option value="gemma4:latest">gemma4:latest</option>
            <option value="qwen3:4b">qwen3:4b</option>
          </select>
          <p id="current-model" aria-live="polite">目前選擇的模型：gemma3:latest</p>
          <label for="question">你的問題</label>
          <textarea id="question" name="question" rows="5" required maxlength="10000"
            aria-describedby="question-help"
            placeholder="例如：Python 的 list 和 tuple 有什麼差別？"></textarea>
          <button type="submit">送出問題</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <p id="elapsed" role="status"></p>
        <noscript>請啟用 JavaScript 以送出問題並顯示回答。</noscript>
      </section>
      <section id="answer-section" aria-labelledby="answer-heading" hidden>
        <h2 id="answer-heading">回答</h2>
        <p id="answer-model"></p>
        <div id="answer"></div>
        <div class="sources-block" role="region" aria-labelledby="sources-heading">
          <h3 id="sources-heading">內容來源</h3>
          <ul id="answer-sources"></ul>
        </div>
      </section>
    </main>
  </body>
</html>
